<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Отзывы — Dragon Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="app">
        <header class="header">
            <img class="header-logo" src="https://zwuwwu.pythonanywhere.com/img/408682797bd54297aeb008b527b6afa6.jpg" alt="Dragon Shop">
            <div class="shop-name">Dragon Shop</div>
            <button class="search-btn" onclick="location.href='catalog.html'">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                    <circle cx="11" cy="11" r="7"></circle>
                    <line x1="17" y1="17" x2="21" y2="21"></line>
                </svg>
            </button>
        </header>

        <div class="cart-header"><div class="cart-title">Отзывы</div></div>

        <div class="review-form">
            <div class="checkout-title">Оставить отзыв</div>
            <div class="checkout-hint">Поделитесь впечатлением</div>

            <label class="checkout-label">Оценка</label>
            <div class="review-stars" id="reviewStars">
                <button class="star-btn" data-star="1">★</button>
                <button class="star-btn" data-star="2">★</button>
                <button class="star-btn" data-star="3">★</button>
                <button class="star-btn" data-star="4">★</button>
                <button class="star-btn" data-star="5">★</button>
            </div>

            <label class="checkout-label">Ваш отзыв</label>
            <textarea class="comment-box" id="reviewText" placeholder="Напишите ваш отзыв..."></textarea>

            <button class="order-btn" onclick="submitReview()">Отправить отзыв</button>
        </div>

        <div class="cart-header" style="padding-top: 40px;">
            <div class="cart-title">Все отзывы</div>
        </div>
        <div id="reviewsContent"></div>

        <nav class="bottom-nav">
            <a href="catalog.html" class="nav-item"><span class="nav-icon">◫</span><span>Каталог</span></a>
            <a href="reviews.html" class="nav-item active"><span class="nav-icon">★</span><span>Отзывы</span></a>
            <a href="index.html" class="nav-item"><span class="nav-icon">◯</span><span>Главная</span></a>
            <a href="cart.html" class="nav-item"><span class="nav-icon">◻</span><span>Корзина</span><span class="nav-badge" id="navBadge"></span></a>
            <a href="orders.html" class="nav-item"><span class="nav-icon">≡</span><span>Заказы</span></a>
        </nav>
    </div>
    <script src="app.js"></script>
</body>
</html>
